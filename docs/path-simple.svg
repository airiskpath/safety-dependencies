<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">From the lab to the real world, the second step is the one that holds</title>
  <desc id="d">Path of attack techniques against AI in the MITRE ATLAS catalogue. Three in four go from idea to lab demonstration, in about eight months, between six and eleven months. Only one in three then goes from lab demonstration to observation in the real world; the median time is estimated at fifty-five months, with no upper bound on the available data.</desc>
  <style>
    .s{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--box:#f1f0eb;--line:#c3c2b7;--pass:#2a78d6;--hard:#eb6834}
    @media (prefers-color-scheme:dark){.s{--bg:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--box:#26262a;--line:#4a4a45;--pass:#3987e5;--hard:#d95926}}
    .bg{fill:var(--bg)}
    .box{fill:var(--box);stroke:var(--line);stroke-width:1}
    .title{fill:var(--ink);font:600 19px system-ui,-apple-system,"Segoe UI",sans-serif}
    .stage{fill:var(--ink);font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
    .stage2{fill:var(--ink2);font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
    .big1{fill:var(--pass);font:700 26px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
    .big2{fill:var(--hard);font:700 26px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
    .lab{fill:var(--ink2);font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
    .small{fill:var(--muted);font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
    .note{fill:var(--muted);font:400 12.5px system-ui,-apple-system,"Segoe UI",sans-serif}
    .a1{stroke:var(--pass);stroke-width:3;fill:none}
    .a2{stroke:var(--hard);stroke-width:3;fill:none}
    .h1{fill:var(--pass)} .h2{fill:var(--hard)}
    .clk{fill:none;stroke:var(--ink2);stroke-width:1.4;stroke-linecap:round}
  </style>
  <g class="s">
    <rect class="bg" width="800" height="330"/>
    <text class="title" x="20" y="36">From the lab to the real world, the second step is the one that holds</text>

    <rect class="box" x="20"  y="120" width="170" height="80" rx="4"/>
    <text class="stage"  x="105" y="166">Idea</text>

    <rect class="box" x="315" y="120" width="170" height="80" rx="4"/>
    <text class="stage"  x="400" y="156">Demonstrated</text>
    <text class="stage2" x="400" y="178">in the lab</text>

    <rect class="box" x="610" y="120" width="170" height="80" rx="4"/>
    <text class="stage"  x="695" y="156">Observed</text>
    <text class="stage2" x="695" y="178">in the real world</text>

    <path class="a1" d="M196 160 H300"/><path class="h1" d="M309 160 l-11 -6 v12 z"/>
    <text class="big1" x="252" y="96">3 in 4</text>
    <text class="lab"  x="252" y="114">get through</text>
    <g class="clk"><circle cx="182" cy="223" r="7"/><path d="M182 223 V218.5 M182 223 L185.2 224.8"/></g>
    <text class="lab"  x="252" y="228">in about 8 months</text>
    <text class="small" x="252" y="245">(between 6 and 11 months)</text>

    <path class="a2" d="M491 160 H595"/><path class="h2" d="M604 160 l-11 -6 v12 z"/>
    <text class="big2" x="547" y="96">1 in 3</text>
    <text class="lab"  x="547" y="114">gets through</text>
    <g class="clk"><circle cx="474" cy="223" r="7"/><path d="M474 223 V218.5 M474 223 L477.2 224.8"/></g>
    <text class="lab"  x="547" y="228">in about 55 months</text>
    <text class="small" x="547" y="245">(no known upper bound)</text>

    <text class="note" x="20" y="290">Attack techniques against AI, in the domain's reference catalogue (MITRE ATLAS), which records</text>
    <text class="note" x="20" y="308">what has been documented, not everything that exists. Median times, 2021-2026.</text>
  </g>
</svg>
