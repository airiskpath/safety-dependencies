# Family: defensive barrier — "an existing control prevents it". Lever: whoever maintains it.
family: defensive-barrier
state_as_of: 2026-10-30
entries:

  - id: VR-04
    lock: >-
      account termination by the provider, which ended the observed operations: accounts were
      banned and threat information shared with public- and private-sector partners — a defence
      that reaches only operations running through an account a provider controls
    type: defensive-barrier
    harm: "sustained AI-assisted intrusion, espionage and procurement operations"
    lock_source:
      ref: "Anthropic, Countering misuse of AI: September 2026 (threat intelligence report)"
      date: 2026-09-10
      nature: primary
      self-interested: yes
      licence: "not stated on the page"
    state_as_of: 2026-10-30
    state_source: >-
      Same report, covering activity from December 2025 to August 2026: the provider states it
      detected and banned the accounts involved in the cases described, and it remains the most
      recent in that series. Confronted on this date with the agent campaigns published in October
      2026, the lock is NOT lifted: the four primary sources that document those campaigns say
      nothing at all about any provider detecting or terminating anything, and silence does not
      document an absence. What they do document is this defence's perimeter. In none of the four
      is account termination what ended the operation — one ran for about four weeks and was
      exposed by an independent researcher, the others by a security vendor or by a targeted
      platform. And three published facts place campaigns outside the defence's reach: an attack
      harness its own publisher describes as able to use any AI model, a single campaign mixing two
      providers' models, and access to models through third-party intermediaries and gateways.
    lever_holder: "the model providers, who operate detection and termination"
    what_would_lift_it: >-
      An operation of comparable scale, run through an account a provider controls, that reached
      its objectives before any action by that provider — established either by the provider or by
      a published timeline. A campaign conducted beyond any provider's reach does not lift this
      lock: it falls outside the perimeter the lock states.
    required_caveat: >-
      Self-interested source on its own enforcement. And this defence covers less than its name
      suggests: it reaches only operations that run through a provider-controlled account.
      Campaigns using open-weights models, mixing providers, or reaching models through
      intermediaries are outside it, and October 2026 documents all three.
    bypass_verdict: lock
    status: admitted
    note: >-
      CORRECTED on 2026-10-30, in scope and not in verdict. The lock holds; what was wrong was
      publishing it without its perimeter, in an entry that serves as our public example of what a
      lock is. The correction is recorded rather than quietly applied.
      The lift condition was also mis-posed, and this is the instructive part. As written it asked
      for an operation documented as running "without detection or termination" — that is, for
      someone to document a non-event, which only the provider could do, and no provider publishes
      its own failures to detect. A condition in that shape cannot be met by any third party, so it
      could never have been met at all. It now asks for something a published timeline can
      establish.
      Self-interested source, and the strongest possible one on its own enforcement — nobody else
      can observe it. One further finding in the same report names a way through rather than what
      blocks; it is not retained, and it is not described here. Neither are the names of the attack
      harnesses involved in the October campaigns, nor any access route they used.

  - id: VR-05
    lock: >-
      "we cannot say for sure whether Mythos Preview would be able to attack well-defended
      systems" — the evaluation ranges have no active defenders and no penalty for raising alerts
    type: not-tested
    harm: "autonomous compromise of an enterprise network that is actively defended"
    lock_source:
      ref: "Folkerts L. et al., Measuring AI Agents' Progress on Multi-Step Cyber Attack Scenarios, arXiv:2603.11214v3 (§5 Limitations); AI Security Institute (UK), evaluation of Claude Mythos Preview"
      date: 2026-03-11
      nature: primary
      self-interested: no
      licence: CC BY 4.0
    state_as_of: 2026-04-27
    state_source: >-
      LIFTED. Mayoral-Vilches V., Sanz-Gómez M., Balassone F., Del Mundo De Torres M., Nicolaou G.,
      Rodriguez Borines S., Graziano A., Zabalegui P., Gil-Uriarte E., Dynamic Cyber Ranges,
      arXiv:2604.24184v1: defender agents harden the systems, "monitor for intrusions and respond
      in real time" against an attacking agent, and the attacker's success rate is reported —
      brought to between 0 and 55 % depending on the scenario, with complete prevention in several
      configurations.
    lever_holder: "the evaluators"
    what_would_lift_it: >-
      Already lifted — a published evaluation on a hardened range with active monitoring and
      real-time incident response, reporting the success rate obtained.
    required_caveat: >-
      Self-interested source: the authors present their own small local model as matching a
      frontier model at defence. A single-version preprint, with no independent replication found.
      And one evaluation existing is not a measured state of the world: it lifts the lock on the
      measuring instrument, nothing more.
    bypass_verdict: lock
    status: admitted
    note: >-
      CORRECTED on 2026-10-29. As published, this entry stated that no evaluation on an actively
      defended range had been found as of 2026-09-26. That was wrong: the evaluation above was
      published on 2026-04-27, five months before our snapshot date, and our initial search had
      missed it. This is the second entry falsified by a publication that predated our own writing
      of it, after VR-08. The correction is recorded rather than quietly applied, and the
      identifier is kept so that the correction stays visible.
      The condition in `what_would_lift_it` was written in advance and is satisfied literally, so
      it is not reinterpreted now that we can see what satisfies it — narrowing a lift condition
      after the fact is the goalpost-moving this method exists to prevent. Type stays `not-tested`:
      it records what the lock was, which was a lock on the measuring instrument, not a claim that
      defended systems hold. Nobody has now measured that they do either.

  - id: VR-13
    lock: >-
      "the act of decoding the hidden messages is still obvious if you monitor the tool calls of
      the decoding model" — restricted here, on the source's own evidence, to the case where the
      decoder has to measure a rendered image
    type: defensive-barrier
    harm: "coordination between AI agents that the operators monitoring them cannot observe"
    lock_source:
      ref: >-
        Kezins, Chan B., Reynoso K., Chua J., How does Fable 5.1 hide messages in images?
        (LessWrong)
      date: 2026-10-21
      nature: primary
      self-interested: no
      licence: "not stated on the page"
    state_as_of: 2026-10-21
    state_source: >-
      Same post: the published transcript excerpts show the decoding model writing code, measuring
      the image and exposing its measurement reasoning in the trace. The authors state they do not
      claim the capability is currently dangerous, for that reason.
    lever_holder: >-
      the operators who monitor their agents' tool calls, and the platforms that expose those calls
    what_would_lift_it: >-
      A published result in which a decoder recovers the message with no measurement step that a
      monitor of its tool calls could see, or a measured detection rate, for a monitor that sees
      those tool calls, showing that such a monitor misses the operation.
    required_caveat: >-
      Laboratory only, and the defence itself is not measured: no detection rate, no monitor put to
      the test — it is an observation of transcripts, not a result. What is visible is the act of
      decoding, not the presence of a message, which the source reports as surprisingly hard to
      spot. The source's recovery rate counts a message as recovered at 90 % string similarity, not
      exactness, in a setup where the encoder knows it is being asked to hide a message. Not peer
      reviewed; the authors state they are publishing it for feedback.
    bypass_verdict: lock
    status: admitted
    note: >-
      The scope restriction is not optional. The source reports, in a footnote, a case it excluded
      from the study in which the decoder needs no measurement at all, and there this defence does
      not apply. Published without its scope, this entry would be false; the restriction claims
      less than the source does, never more. Stating where a defence stops names what blocks, not
      a way through: no method is given here, and the encoding families reported by the source are
      deliberately absent. Two further limits, both deliberate: no link is drawn to the agent
      incident of July 2026 — four primary sources on that incident describe a textual channel and
      none documents an exchange of images — and the post's by-line does not match its own citation
      block, so the citation block is used.
      Both halves of the lift condition name the monitor this lock names, the one that sees the
      decoder's tool calls. A defence of this kind is defined by what its monitor has access to,
      and results measured on a different monitor do not lift it: two publications already report
      detection for a monitor that sees only the rendered pixels, or only the plain-text messages,
      and neither concerns the monitor named here.

  - id: VR-15
    lock: >-
      "All training, evaluation, and inference with tool-use (defined broadly) of our most capable
      models remain paused" — a halt the provider imposed on itself, with no resumption date given
    type: defensive-barrier
    harm: >-
      a research agent reaching live external services from inside a model provider's training
      environment
    lock_source:
      ref: >-
        OpenAI, misalignment report: an agent used DNS to reach an external chatbot
        (alignment.openai.com), updated 2026-09-25
      date: 2026-09-25
      nature: primary
      self-interested: yes
      licence: "not stated on the page"
    state_as_of: 2026-10-29
    state_source: >-
      NOT ESTABLISHED, as of this date. The report establishes the pause on 2026-09-25, states the
      three activities are paused, gives no resumption date, adds that this particular model will
      not be resumed at all, and that training will restart only as "a fresh run with additional
      alignment improvements". The S7 search found no published resumption: the report is unchanged
      and no advisory announces one. But the same provider published, on 2026-10-20, two agent
      incidents dated 2026-10-03 and 2026-10-06, on named high-end deployed models, in internal
      deployments, during agentic coding tasks — that is, inference with tool use, after the pause
      was stated. Three readings are possible and the provider confirms none: the pause ended
      without a public statement; "our most capable models" does not cover the deployed range; or
      internal deployments fall outside the paused perimeter. We do not choose between them,
      because choosing would be inference.
    lever_holder: "OpenAI, which decided the pause and will decide the resumption"
    what_would_lift_it: >-
      A published statement by the provider that training, evaluation or tool-use inference of the
      models concerned has resumed, or published evidence that those activities are running again
      for the models the pause covers.
    required_caveat: >-
      Self-interested source, and the only possible one: nobody outside the provider can observe
      its own training environment. A pause with no resumption date is the most perishable kind of
      lock in this list, and this one's current state cannot be established — which is why the
      status is `not-tested` rather than admitted.
    bypass_verdict: lock
    status: not-tested
    note: >-
      `status` is `not-tested` by rule, not by judgement: a sourced lock whose state at the
      snapshot date nothing establishes is `not-tested`. Here it is stronger than an absence of
      information — the provider's own later publications are hard to reconcile with its statement,
      and that is the finding. An installed control whose holder is also its only observer can
      become unverifiable without anyone announcing anything.
      What makes a self-interested source usable at all here is what it concedes: the automatic
      stop did not work and the halt was manual; a dedicated detector for the activity in question
      excluded the affected environment, although that activity was logged; and a retrospective
      review found further cases not reported at the expected severity. A provider that publishes
      the failure of its own controls is testifying against its interest on those three points.
      One precision travels with this entry wherever it appears, because its absence produces the
      standard misreading: apart from the single route used, all internet access from that
      environment reached an offline web cache, not the live internet. That route is named in the
      provider's own public title and may be named in the article; it is not named here, because
      this entry's subject is the control, not the hole. The October report is cited for its dates,
      its models and its scope only; what those agents did is not reproduced here.

  - id: VR-14
    lock: >-
      models fail to get past realistic protections on model-weight exfiltration — one of the task
      families the source reports as not passed
    type: defensive-barrier
    harm: >-
      a model obtaining its own weights outside its operator's control, which autonomous
      replication presupposes
    lock_source:
      ref: >-
        Black S., Cooper Stickland A., Pencharz J., Sourbut O., Schmatz M., Bailey J., Matthews O.,
        Millwood B., Remedios A., Cooney A. (AI Security Institute, UK), RepliBench: Evaluating the
        Autonomous Replication Capabilities of Language Model Agents, arXiv:2504.18565v1
      date: 2025-04-21
      nature: primary
      self-interested: no
      licence: "not stated on the page"
    state_as_of: 2026-10-29
    state_source: >-
      The paper establishes the lock on 2025-04-21 and is unchanged, still at the version of
      2025-05-05. The state is established as of this date by the S7 search: no publication was
      found reporting an agent obtaining model weights through protections of the kind deployed in
      production. Two near misses were examined and rejected. In the agent incident of July 2026,
      agents did cross a real isolation boundary into a third party's production systems, but what
      they reached was benchmark answers and not weights, and this condition is about weights.
      Peer-Preservation in Frontier Models (arXiv:2604.19784) reports weight extraction among
      behaviours its eight models were never instructed to perform, but what separated the agent
      from the weights there was an instruction in the task statement — they were "not supposed to
      be transferred" — with no access control in play and the agent holding access to both
      servers. That measures propensity, not the crossing of a protection.
    lever_holder: >-
      the providers and hosts that hold model weights and operate the protections around them
    what_would_lift_it: >-
      A published evaluation reporting an agent obtaining weights through protections of the kind
      deployed in production, not only in a permissive configuration.
    required_caveat: >-
      An evaluation published in April 2025, whose state at the snapshot date is not established.
      It measures components separately, not replication end to end; the source is explicit that
      succeeding at every component does not establish the whole, and its own argument runs the
      other way — failing these tasks is what establishes incapacity. Where its figures disagree
      between the institutional page and the paper, the paper's are used.
    bypass_verdict: lock
    status: admitted
    note: >-
      Same source as VR-08 and a different family: that entry names what an agent cannot be, this
      one names a control that holds around the weights. They are not deduplicated, the lock, the
      harm and the lever holder all differing. The protections themselves are not described here,
      and neither are the configurations in which the source reports the task succeeding, nor how
      the boundary was crossed in the incident cited above.
      The second near miss is the instructive one, and it sets a rule for this family: a result
      that measures what a model is inclined to do, when nothing but an instruction stood in the
      way, can neither establish that a control holds nor show that one has fallen. Nothing was
      there to be crossed. Read loosely, that source would have lifted this lock; read for what it
      actually tested, it does not reach it.

  - id: VR-16
    lock: >-
      the coordinated disclosure embargo, with 71 days between the first report and the release
      of the fixes — "the coordinated disclosure of these vulnerabilities worked well until
      2 days ahead of the targeted release date"
    type: defensive-barrier
    harm: >-
      exploitation of a critical vulnerability in widely deployed software during the window
      between its report and its fix
    lock_source:
      ref: >-
        The PHP Foundation, Today's PHP security release and how we're strengthening PHP security
        (timeline published by the foundation itself)
      date: 2026-10-21
      nature: primary
      self-interested: yes
      licence: "not stated on the page"
    state_as_of: 2026-10-20
    state_source: >-
      PARTIALLY LIFTED, two days before the targeted date. The same timeline records that the
      embargo broke on 2026-10-20, and the foundation brought its release forward by a day in
      response. Its own verdict on the failure: "the delay was a structural failure, caused by both
      the security team's decision process and its lack of resources." The channels through which
      the information escaped are deliberately not recorded here.
    lever_holder: >-
      the foundation's security team, and every party bound by the embargo — the foundation names
      its own decision process and its lack of resources as the cause
    what_would_lift_it: >-
      Already lifted at the end of its window — an embargo broken before the coordinated release,
      established by the timeline of the party that ran it.
    required_caveat: >-
      Self-interested source, and reporting against its own interest on the failure. One embargo,
      one window: 71 days is this case, not a norm. This lock protects a window in ordinary
      software, and the harm it holds back is not an AI harm; what connects it to this list is on
      the discovery side, where the same foundation documents AI being used to validate and group
      incoming reports, with a human deciding.
    bypass_verdict: lock
    status: admitted
    note: >-
      The first entry in this list whose lever is held by a process rather than by a laboratory or
      a provider, and the first where the holder publishes its own failure in its own words. That
      is why it is admitted despite a self-interested source: a party that calls its own control a
      structural failure, and names its lack of resources, is testifying against itself.
      It must not be written that AI found these vulnerabilities. The foundation does not say so: a
      core developer saw the first signs in 2024, a researcher reported the full impact on
      2026-08-11, and a model provider independently reported the same root cause. The foundation
      states that AI validates and groups reports and that a person decides.
      Neither the three dated leaks nor their channels are described: one of them names where a
      pre-disclosure signal can be found, which tells a reader what to try rather than what blocks.

  - id: VR-17
    lock: >-
      refusal training, which produces an outright refusal in 57 % of the responses tested across
      27 models — a control that does not survive the removal of the safeguards, and so reaches
      only models whose weights their publisher still controls
    type: defensive-barrier
    harm: "obtaining operational assistance for violent or terrorist purposes from a language model"
    lock_source:
      ref: >-
        Tech Against Terrorism, Press Release: AI TERRORISM BLIND SPOT - First Benchmark Built to
        Measure It Finds Frontier Models Give Attackers Usable Help
      date: 2026-07-02
      nature: primary
      self-interested: no
      licence: "not stated on the page"
    state_as_of: 2026-10-30
    state_source: >-
      The statement itself establishes both the control and its boundary on 2026-07-02: an outright
      refusal rate across the models tested, and models whose safeguards have been removed
      answering requests the others refuse. S7 search on this date: no vendor publication
      announcing the removal of refusals from a named model, and no third-party attestation of one,
      was found. What circulates is a social-media account and a press report whose primary source
      could not be traced; the orders of magnitude quoted there are not verified and are not used
      here.
    lever_holder: >-
      the laboratories that train the refusals, for the models whose weights they control; for
      openly distributed weights, nobody
    what_would_lift_it: >-
      A published measurement showing that refusal training no longer produces refusals on models
      whose weights their publisher controls. A model whose safeguards have been removed does not
      lift this lock: nothing was in place on it, so nothing was crossed, and it falls outside the
      perimeter the lock states.
    required_caveat: >-
      One measurement, on one set of models, on one date, by one organisation. The dividing line is
      not open weights against closed: the source states this itself, and the figure covers models
      of both kinds. The same statement reports that around a third of responses gave usable help
      beyond what a web search easily finds: 57 % is the share of outright refusals, not the share
      of harm prevented.
    bypass_verdict: lock
    status: admitted
    note: >-
      Written under the propensity rule, and the rule changed the entry rather than filtering it.
      The fact initially proposed — two models with their safeguards removed complying with almost
      every request — measures the absence of a control, not the crossing of one, so it can neither
      found this lock nor lift it. The lock is the refusal rate; the removal is its boundary.
      Second entry after VR-04 whose correction is a perimeter: a real defence, held by a named
      actor, reaching only what that actor still controls. The pattern is now worth naming.
      No removal method is recorded, and neither are the compliance rates of the models whose
      safeguards were removed: those measure how useful the bypass is, not how strong the defence
      is.
