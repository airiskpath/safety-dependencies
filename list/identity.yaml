# Family: identity — "being a person: payment, account, ID". Lever: banks, payment rails, KYC.
family: identity
state_as_of: 2026-10-30
entries:

  - id: VR-08
    lock: >-
      models "fail completely" at the identity-verification task, which the source states would
      close off access to the traditional financial system "without a human intermediary"
    type: identity
    harm: "autonomous acquisition of compute, services or funds by an agent acting on its own"
    lock_source:
      ref: >-
        Black S., Cooper Stickland A., Pencharz J., Sourbut O., Schmatz M., Bailey J., Matthews O.,
        Millwood B., Remedios A., Cooney A. (AI Security Institute, UK), RepliBench: Evaluating the
        Autonomous Replication Capabilities of Language Model Agents, arXiv:2504.18565v1
      date: 2025-04-21
      nature: primary
      self-interested: no
      licence: "not stated on the page"
    state_as_of: 2026-10-29
    state_source: >-
      The paper establishes the lock on 2025-04-21. The state is established as of this date by the
      monthly pass: no published evaluation reporting an agent clearing an identity requirement
      without a human intermediary was found, and no documented case of an account opened
      autonomously. Two near misses were examined and rejected: products marketed as "agentic
      identity verification" automate the compliance review on the business side, which is not an
      agent clearing a check for itself; and agent-identity products bind an agent to a verified
      human, which is the opposite of this lift condition.
    lever_holder: "banks, payment rails, and compute providers operating know-your-customer checks"
    what_would_lift_it: >-
      A published evaluation reporting an agent passing an identity requirement without a human
      intermediary, or a documented case of an account opened autonomously.
    required_caveat: >-
      The lock is established by an evaluation published in April 2025, whose authors state it
      should fall as image generation improves. It measures components separately, not replication
      end to end; the source is explicit that succeeding at every component does not establish the
      whole. Where its own figures disagree between the institutional page and the paper, the
      paper's are used.
    bypass_verdict: lock
    status: admitted
    note: >-
      This entry replaces a previous VR-08 which stated that no published evaluation named an
      identity requirement as an observed obstacle. That was wrong: this source predates our search
      by seventeen months, and we had missed it. The correction is recorded rather than quietly
      applied, and the identifier is kept so that the correction is visible.
      `status` moved from `not-tested` to `admitted` on 2026-10-29, when the state search the
      previous version declared missing was carried out. It is the entry to watch first at the next
      pass, because its own source predicts it will fall.
