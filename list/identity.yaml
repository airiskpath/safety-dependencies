# Family: identity — "being a person: payment, account, ID". Lever: banks, payment rails, KYC.
family: identity
state_as_of: 2026-09-26
entries:

  - id: VR-08
    lock: >-
      models "fail completely" at the identity-verification task, which the source states would
      close off access to the traditional financial system "without a human intermediary"
    type: identity
    harm: "autonomous acquisition of compute, services or funds by an agent acting on its own"
    lock_source:
      ref: >-
        Black S., Cooper Stickland A., Pencharz J., Sourbut O., Schmatz M., Bailey J., Matthews O.,
        Millwood B., Remedios A., Cooney A. (AI Security Institute, UK), RepliBench: Evaluating the
        Autonomous Replication Capabilities of Language Model Agents, arXiv:2504.18565v1
      date: 2025-04-21
      nature: primary
      self-interested: no
      licence: "not stated on the page"
    state_as_of: 2025-04-21
    state_source: >-
      The paper itself, on the date above. Not yet established: whether any publication
      since reports an agent clearing an identity requirement on its own. Until that search exists,
      the state at the snapshot date is not established and the status below stays `not-tested`.
    lever_holder: "banks, payment rails, and compute providers operating know-your-customer checks"
    what_would_lift_it: >-
      A published evaluation reporting an agent passing an identity requirement without a human
      intermediary, or a documented case of an account opened autonomously.
    required_caveat: >-
      An evaluation whose authors state this lock should fall as image generation improves, and
      which is eighteen months old at the snapshot date. It measures components separately, not
      replication end to end; the source is explicit that succeeding at every component does not
      establish the whole. Where its own figures disagree between the institutional page and the
      paper, the paper's are used.
    bypass_verdict: lock
    status: not-tested
    note: >-
      This entry replaces a previous VR-08 which stated that no published evaluation named an
      identity requirement as an observed obstacle. That was wrong: this source predates our search
      by seventeen months, and we had missed it. The correction is recorded rather than quietly
      applied, and the identifier is kept so that the correction is visible. `status` is
      `not-tested` because the lock is established and its state at the snapshot date is not —
      which is the grid's own rule for a sourced lock without a state source, not a judgement call.
