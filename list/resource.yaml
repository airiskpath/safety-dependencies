# Family: resource — "money, compute, hardware". Lever: compute providers.
family: resource
state_as_of: 2026-10-30
entries:

  - id: VR-09
    lock: >-
      no published evaluation names compute or money as an obstacle; the measured relation runs
      the other way — "model performance scales log-linearly with inference-time compute, with no
      observed plateau", spending more simply buys more steps
    type: not-tested
    harm: "running autonomous attack operations at a scale that resources would otherwise limit"
    lock_source:
      ref: "Folkerts L. et al., Measuring AI Agents' Progress on Multi-Step Cyber Attack Scenarios, arXiv:2603.11214v3"
      date: 2026-03-11
      nature: primary
      self-interested: no
      licence: CC BY 4.0
    state_as_of: 2026-10-19
    state_source: >-
      SECOND BRANCH OF THE LIFT CONDITION MET. The original paper tests at 10M and 100M tokens and
      states higher budgets "would likely yield further improvements", describing its own figures
      as a lower bound. Since then: Reuters, 2026-10-19, read on a syndicated full reprint, reports
      an agent campaign run by a single operator that spent about 5,000 dollars in tokens in total,
      about 50 dollars per successful intrusion, and compromised more than a hundred organisations
      out of more than 1,200 targeted, with three named industrial companies and two small firms
      confirming to the reporters. A cost documented, quantified and negligible relative to its
      effect, which is what the second branch asks for. The first branch — a published evaluation
      reporting a resource ceiling that stops an operation — is still unmet.
    lever_holder: "compute providers"
    what_would_lift_it: >-
      Met on the second branch — an operation whose cost is documented as negligible relative to
      its effect. The first branch stands: a published evaluation reporting a resource ceiling that
      stops an operation.
    required_caveat: >-
      The laboratory figures are measurements on ranges without active defenders and say nothing
      about cost in real environments. The October figures come from one journalistic
      investigation, read on a syndicated reprint; the amount is the attacker's token spend alone,
      not the cost of the operation; and one campaign is one observation, not a rate.
    bypass_verdict: lock
    status: admitted
    note: >-
      WHAT "MET" MEANS HERE, AND IT IS NOT WHAT IT MEANS ELSEWHERE IN THIS LIST. No defence fell.
      This entry never recorded a lock: it recorded that where the typology expects a resource
      lock, none exists, and that the measured relation runs the other way. Meeting the second
      branch confirms that absence instead of ending a protection. Any public wording that labels
      this entry "lifted" the way VR-02, VR-05 or VR-11 are labelled would tell the reader the
      opposite of what happened. It should read: no defence in this family, and that is now
      documented rather than merely unsearched.
      CORRECTED on 2026-10-30. Our state source of 2026-10-29 said no publication had been found
      in either direction. That was wrong on the second branch, by ten days. This is the third
      entry falsified by a publication that predated our own assertion about it, after VR-08 and
      VR-05 — and it is the entry the reliability ranking had named as the most exposed, for the
      reason it gave: an absence resting on nothing but our own search.
      The cause is identifiable and has been turned into a rule. The search was run against
      "published evaluations", which is the wording of the first branch, while the second branch
      asks for a documented operation and admits a report. One query was run for a condition that
      contained two.
