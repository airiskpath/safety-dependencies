# Family: not tested — "may already be possible, nobody has checked". Lever: the evaluators.
# The eighth category is not a residue: it is the answer wherever the world is silent, and saying
# so is a published result, not an omission.
family: not-tested
state_as_of: 2026-10-30
entries:

  - id: VR-10
    lock: >-
      the behaviours that distinguish the highest-risk actors — using AI to orchestrate steps in
      the attack chain sequentially, make real-time decisions, and execute without human
      intervention — "are not yet included as attacker techniques in the MITRE ATT&CK framework"
    type: not-tested
    harm: "AI-orchestrated intrusion whose distinguishing features no standard framework records"
    lock_source:
      ref: "Anthropic, What we learned mapping a year's worth of AI-enabled cyber threats"
      date: 2026-06-03
      nature: primary
      self-interested: yes
      licence: "not stated on the page"
    state_as_of: 2026-10-29
    state_source: >-
      Same report, based on 832 accounts banned for malicious cyber activity between March 2025 and
      March 2026, mapped onto MITRE ATT&CK. Tested against a new release since: ATT&CK v20, of
      2026-10-13, adds AI techniques — AI-assisted exfiltration, direct and indirect prompt
      injection, result poisoning, anti-automation evasion, impairing autonomous defences — and
      none of them describes an agent orchestrating an attack chain on its own. Verified on the
      closest one, AI-assisted exfiltration (T1700): there the agent is an enterprise agent
      manipulated by an adversary into a single action, the tool rather than the orchestrator. The lock holds
      against a published version, as of this date, and no longer merely for want of a new one.
    lever_holder: "MITRE, which maintains the framework, and the evaluators who feed it"
    what_would_lift_it: >-
      A released version of ATT&CK that includes techniques for autonomous orchestration of an
      attack chain.
    required_caveat: >-
      Self-interested source: the provider analyses misuse of its own model, and nobody else can
      observe that population.
    bypass_verdict: lock
    status: admitted
    note: >-
      This is a lock on the measuring instrument, not on the attacker. It is admitted because the
      source names it explicitly and because a missing category is what keeps this harm unmeasured.
