name: State update
description: An existing entry has changed (a lock has fallen, or a new source confirms it still holds).
title: "[State update] VR-"
labels: ["state update"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry id (e.g. VR-01)
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: What changed
      options: ["the lock has fallen", "a new source confirms it still holds", "other"]
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source (link) and its date
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: The passage that establishes the new state
      description: Quote it. Never describe a way through.
    validations:
      required: true
